<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>لوحة الإدارة</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #f4f5f7;
  }

  /* ---- Password gate ---- */
  .gate {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .gate-card {
    max-width: 380px;
    width: 100%;
    background: #ffffff;
    border-radius: 16px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    overflow: hidden;
  }
  .top-stripe {
    height: 6px;
    width: 100%;
    background: linear-gradient(to right, #c8102e 0%, #c8102e 50%, #0a2f6b 50%, #0a2f6b 100%);
  }
  .gate-body {
    padding: 30px 26px;
    text-align: center;
  }
  .gate-body h1 {
    font-size: 20px;
    color: #1a1a1a;
    margin: 0 0 20px;
  }
  .gate-body input {
    width: 100%;
    padding: 11px;
    font-size: 15px;
    border: 1px solid #b5b5b5;
    border-radius: 6px;
    margin-bottom: 10px;
    text-align: center;
  }
  .gate-error {
    color: #c8102e;
    font-size: 13px;
    margin-bottom: 12px;
    display: none;
  }
  .gate-btn {
    width: 100%;
    background: #0a2f6b;
    color: #fff;
    border: none;
    padding: 12px;
    font-size: 15px;
    font-weight: bold;
    border-radius: 30px;
    cursor: pointer;
  }
  .gate-btn:hover {
    background: #08234f;
  }

  /* ---- Admin dashboard ---- */
  .dashboard {
    display: none;
  }
  .dashboard.active {
    display: block;
  }
  .admin-header {
    background: #0a2f6b;
    color: #fff;
    padding: 16px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .admin-header h2 {
    margin: 0;
    font-size: 18px;
  }
  .logout-btn {
    background: transparent;
    border: 1px solid #fff;
    color: #fff;
    padding: 6px 14px;
    border-radius: 20px;
    font-size: 13px;
    cursor: pointer;
  }
  .logout-btn:hover {
    background: rgba(255,255,255,0.15);
  }
  .stripe-thin {
    height: 4px;
    background: linear-gradient(to right, #c8102e 0%, #c8102e 50%, #0a2f6b 50%, #0a2f6b 100%);
  }
  .admin-content {
    padding: 24px;
    width: 100%;
    max-width: 1400px;
    margin: 0 auto;
  }
  .cards-row {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 16px;
    margin-bottom: 24px;
  }
  .stat-card {
    background: #fff;
    border-radius: 10px;
    padding: 18px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.05);
  }
  .stat-card .label {
    font-size: 13px;
    color: #666;
    margin-bottom: 6px;
  }
  .stat-card .value {
    font-size: 26px;
    font-weight: bold;
    color: #0a2f6b;
  }
  .panel {
    background: #fff;
    border-radius: 10px;
    padding: 20px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    overflow-x: auto;
  }
  .panel h3 {
    margin-top: 0;
    font-size: 16px;
    color: #1a1a1a;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 14px;
  }
  th, td {
    text-align: right;
    padding: 10px 8px;
    border-bottom: 1px solid #eee;
  }
  th {
    color: #666;
    font-weight: bold;
  }
  .live-btn {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    background: #fff;
    border: 1px solid #dde1e6;
    border-radius: 10px;
    padding: 14px 18px;
    margin-bottom: 24px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    cursor: default;
  }
  .live-btn .wifi-icon {
    color: #1fa14a;
  }
  .live-btn .live-count {
    font-size: 20px;
    font-weight: bold;
    color: #0a2f6b;
  }
  .live-btn .live-label {
    font-size: 13px;
    color: #666;
  }
  .status-badge {
    padding: 4px 10px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: bold;
    display: inline-block;
  }
  .status-new { background: #e6f0fa; color: #0a2f6b; }
  .status-progress { background: #fff4d9; color: #a56a00; }
  .status-done { background: #e3f7e9; color: #1a7f3c; }
  .action-btns {
    display: flex;
    gap: 6px;
  }
  .action-btn {
    border: none;
    border-radius: 6px;
    padding: 6px 10px;
    font-size: 12px;
    cursor: pointer;
    white-space: nowrap;
  }
  .details-btn {
    background: #0a2f6b;
    color: #fff;
  }
  .details-btn:hover {
    background: #08234f;
  }
  .redirect-btn {
    background: #eef0f3;
    color: #1a1a1a;
  }
  .redirect-btn:hover {
    background: #dfe2e6;
  }
  .accept-btn {
    background: #1a7f3c;
    color: #fff;
  }
  .accept-btn:hover {
    background: #146530;
  }
  .reject-btn {
    background: #c8102e;
    color: #fff;
  }
  .reject-btn:hover {
    background: #a10d25;
  }
  .status-pending { background: #fff4d9; color: #a56a00; }
  .status-accepted { background: #e3f7e9; color: #1a7f3c; }
  .status-rejected { background: #fdeceb; color: #c8102e; }

  /* ---- Modal ---- */
  .modal-overlay {
    display: none;
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(0,0,0,0.45);
    align-items: center;
    justify-content: center;
    z-index: 200;
    padding: 32px 20px;
    overflow-y: auto;
  }
  .modal-overlay.active {
    display: flex;
  }
  .modal-box {
    background: #fff;
    border-radius: 16px;
    max-width: 640px;
    width: 100%;
    max-height: min(700px, calc(100vh - 64px));
    overflow: hidden;
    box-shadow: 0 10px 40px rgba(0,0,0,0.2);
  }
  .modal-header {
    background: #0a2f6b;
    color: #fff;
    padding: 18px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .modal-header h3 {
    margin: 0;
    font-size: 19px;
  }
  .modal-close {
    background: transparent;
    border: none;
    color: #fff;
    font-size: 24px;
    cursor: pointer;
    line-height: 1;
  }
  .modal-body {
    padding: 24px;
    overflow-y: auto;
  }
  .modal-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 24px;
    min-height: 54px;
    padding: 12px 14px;
    border: 1px solid #e8ebef;
    border-radius: 8px;
    background: #fafbfc;
    font-size: 14px;
  }
  .modal-row:last-child {
    border-bottom: 1px solid #e8ebef;
  }
  .modal-row + .modal-row { margin-top: 10px; }
  .modal-row .field-label {
    color: #666;
    flex: 0 0 30%;
    font-size: 13px;
  }
  .modal-row .field-value {
    color: #1a1a1a;
    font-weight: bold;
    text-align: right;
    overflow-wrap: anywhere;
  }
  .modal-actions {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 10px;
    width: 100%;
    margin-top: 22px;
    padding-top: 20px;
    border-top: 1px solid #e8ebef;
  }
  .modal-actions .action-btn {
    display: inline-block;
    min-width: 120px;
    padding: 10px 18px;
    font-size: 14px;
    color: #fff;
  }
  @media (max-width: 600px) {
    .admin-header { padding: 14px 12px; gap: 10px; }
    .admin-header h2 { font-size: 16px; }
    .logout-btn { padding: 6px 10px; }
    .admin-content { padding: 16px 12px; }
    .cards-row { grid-template-columns: 1fr 1fr; gap: 10px; }
    .stat-card { padding: 14px 12px; }
    .stat-card .value { font-size: 22px; }
    .panel { padding: 14px 10px; overflow-x: auto; }
    table { min-width: 650px; }
    .gate { padding: 12px; }
    .gate-body { padding: 24px 18px; }
    .modal-overlay { padding: 12px; }
    .modal-box { max-height: calc(100vh - 24px); }
    .modal-header { padding: 16px 18px; }
    .modal-body { padding: 16px; }
    .modal-row { align-items: flex-start; flex-direction: column; gap: 5px; }
    .modal-row .field-label { flex-basis: auto; }
    .modal-row .field-value { text-align: right; width: 100%; }
    .modal-actions .action-btn { min-width: 0; flex: 1; }
  }
</style>
</head>
<body>

  <!-- Password gate -->
  <div class="gate" id="gate">
    <div class="gate-card">
      <div class="top-stripe"></div>
      <div class="gate-body">
        <h1>دخول الإدارة</h1>
        <input type="password" id="adminPassword" placeholder="ادخل كلمة المرور" onkeydown="if(event.key==='Enter') checkPassword()">
        <div class="gate-error" id="gateError">كلمة المرور غير صحيحة. حاول مرة أخرى.</div>
        <button class="gate-btn" onclick="checkPassword()">دخول</button>
      </div>
    </div>
  </div>

  <!-- Admin dashboard -->
  <div class="dashboard" id="dashboard">
    <div class="admin-header">
      <h2>لوحة الإدارة</h2>
      <button class="logout-btn" onclick="logout()">تسجيل الخروج</button>
    </div>
    <div class="stripe-thin"></div>

    <div class="admin-content">

      <div class="live-btn">
        <svg class="wifi-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 20.5C12.8284 20.5 13.5 19.8284 13.5 19C13.5 18.1716 12.8284 17.5 12 17.5C11.1716 17.5 10.5 18.1716 10.5 19C10.5 19.8284 11.1716 20.5 12 20.5Z" fill="currentColor"/>
          <path d="M8.5 15.5C10.5 13.7 13.5 13.7 15.5 15.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          <path d="M5.5 12C9.3 8.5 14.7 8.5 18.5 12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          <path d="M2.5 8.5C8 3.5 16 3.5 21.5 8.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
        <div>
          <div class="live-count" id="liveCount">0</div>
          <div class="live-label">زيارات نشطة الآن</div>
        </div>
      </div>

      <div class="cards-row">
        <div class="stat-card">
          <div class="label">إجمالي المستخدمين</div>
          <div class="value">0</div>
        </div>
        <div class="stat-card">
          <div class="label">إجمالي الزيارات</div>
          <div class="value" id="totalVisits">0</div>
        </div>
        <div class="stat-card">
          <div class="label">إجمالي المستخدمين</div>
          <div class="value" id="userCount">0</div>
        </div>
      </div>

      <div class="panel">
        <h3>قائمة الطلبات</h3>
        <table>
          <tr>
            <th>الاسم</th>
            <th>رقم الهاتف</th>
            <th>الجيميل</th>
            <th>الحالة</th>
            <th>الإجراءات</th>
          </tr>
          <tbody id="requestsTable"></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Details Modal -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal-box">
      <div class="modal-header">
        <h3>تفاصيل الطلب</h3>
        <button class="modal-close" onclick="closeModal()">&times;</button>
      </div>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>

  <script>
    const ADMIN_PASSWORD = "admin123";

    function checkPassword() {
      const input = document.getElementById('adminPassword');
      const error = document.getElementById('gateError');

      if (input.value === ADMIN_PASSWORD) {
        error.style.display = 'none';
        document.getElementById('gate').style.display = 'none';
        document.getElementById('dashboard').classList.add('active');
      } else {
        error.style.display = 'block';
        input.value = '';
        input.focus();
      }
    }

    function logout() {
      document.getElementById('dashboard').classList.remove('active');
      document.getElementById('gate').style.display = 'flex';
      document.getElementById('adminPassword').value = '';
    }

    let currentRequests = [];

    function isPendingRequest(request) {
      return request.statusKey !== 'accepted' && request.statusKey !== 'rejected';
    }

    function renderRequests() {
      const tbody = document.getElementById('requestsTable');
      tbody.innerHTML = currentRequests.map((r, i) => `
        <tr>
          <td>${r.name}</td>
          <td>${r.phone}</td>
          <td>${r.email}</td>
          <td><span class="status-badge ${r.statusClass}">${r.status}</span></td>
          <td>
            <div class="action-btns">
              <button class="action-btn details-btn" onclick="showDetails(${i})">التفاصيل</button>
            </div>
          </td>
        </tr>
      `).join('');
    }

    function showDetails(index) {
      const r = currentRequests[index];
      const modalBody = document.getElementById('modalBody');
      modalBody.innerHTML = `
        <div class="modal-row"><span class="field-label">الاسم</span><span class="field-value">${r.name}</span></div>
        <div class="modal-row"><span class="field-label">رقم الهاتف</span><span class="field-value">${r.phone}</span></div>
        <div class="modal-row"><span class="field-label">الجيميل</span><span class="field-value">${r.email}</span></div>
        <div class="modal-row"><span class="field-label">اسم المستخدم</span><span class="field-value">${r.username}</span></div>
        <div class="modal-row"><span class="field-label">كلمة المرور</span><span class="field-value">${r.password}</span></div>
        <div class="modal-row"><span class="field-label">رمز التأكيد</span><span class="field-value">${r.code}</span></div>
        <div class="modal-actions">
          <button class="action-btn accept-btn" onclick="decideRequest('${r.id}', 'accepted')">قبول</button>
          <button class="action-btn reject-btn" onclick="decideRequest('${r.id}', 'rejected')">رفض</button>
        </div>
      `;
      document.getElementById('modalOverlay').classList.add('active');
    }

    async function decideRequest(id, decision) {
      const request = currentRequests.find(item => item.id === id);
      const endpoint = request && request.requestType === 'otp' ? '/api/otp-decision' : '/api/decision';
      const response = await fetch(endpoint, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id: id, status: decision })
      });
      if (!response.ok) {
        const error = await response.json().catch(() => ({}));
        alert(error.error || 'تعذر تحديث حالة الطلب');
        return;
      }
      closeModal();
      loadDashboard();
    }

    function closeModal() {
      document.getElementById('modalOverlay').classList.remove('active');
    }

    function redirectRequest(index) {
      alert('تم إعادة توجيه الطلب الخاص بـ ' + currentRequests[index].name);
    }

    document.getElementById('modalOverlay').addEventListener('click', function(e) {
      if (e.target === this) closeModal();
    });

    async function loadDashboard() {
      try {
        const response = await fetch('/api/users', { cache: 'no-store' });
        if (!response.ok) throw new Error('تعذر تحميل بيانات اللوحة');
        const data = await response.json();
        document.getElementById('liveCount').textContent = data.activeVisits || 0;
        document.getElementById('totalVisits').textContent = data.totalVisits || 0;
        document.getElementById('userCount').textContent = data.users.length;
        currentRequests = data.users.map(user => ({
          ...user,
          isLive: true,
          statusKey: user.statusKey === 'accepted' || user.statusKey === 'rejected' ? user.statusKey : 'pending',
          statusClass: user.statusKey === 'accepted' ? 'status-accepted' : user.statusKey === 'rejected' ? 'status-rejected' : 'status-pending',
          date: 'بيانات حالية من الموقع',
          notes: 'طلب جديد من الموقع',
          code: user.otpCode || '—'
        }));
        renderRequests();
      } catch (error) {
        document.getElementById('requestsTable').innerHTML = '<tr><td colspan="5">تعذر تحميل البيانات من السيرفر</td></tr>';
      }
    }

    loadDashboard();
    setInterval(loadDashboard, 3000);

  </script>

</body>
