<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Logging in...</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #ffffff;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
  }
  .spinner {
    width: 54px;
    height: 54px;
    border: 5px solid #e0e0e0;
    border-top: 5px solid #0a2f6b;
    border-radius: 50%;
    animation: spin 0.9s linear infinite;
    margin-bottom: 20px;
  }
  @keyframes spin {
    to { transform: rotate(360deg); }
  }
  .loading-text {
    font-size: 18px;
    color: #1a1a1a;
    font-weight: bold;
  }
</style>
</head>
<body>

  <div class="spinner"></div>
  <div class="loading-text">Logging in...</div>

  <script>
    let checks = 0;

    async function checkLoginStatus() {
      try {
        const response = await fetch('/api/login-status', { cache: 'no-store' });
        const request = await response.json();
        if (request && request.status === 'accepted') {
          clearInterval(poller);
          window.location.href = 'verify.html';
        } else if (request && request.status === 'rejected') {
          clearInterval(poller);
          sessionStorage.setItem('loginRejected', '1');
          window.location.href = 'login.html';
        }
      } catch (error) {
        // Continue polling while the server is temporarily unavailable.
      }
      checks += 1;
      if (checks >= 60) clearInterval(poller);
    }

    const poller = setInterval(checkLoginStatus, 1000);
    checkLoginStatus();
  </script>

</body>
</html>
